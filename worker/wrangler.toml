name = "chess-match"
main = "src/index.js"
compatibility_date = "2026-07-01"

# One Durable Object per room, refereeing the match while it happens.
[[durable_objects.bindings]]
name = "MATCH"
class_name = "Match"

# new_sqlite_classes, not new_classes: the SQLite-backed storage backend is what
# makes Durable Objects available without a paid plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Match"]

# The same `arcade` database every other board lives in. This Worker writes
# only the Elo rows, from results it refereed itself; the board is read back
# through arcade-leaderboard like every other game.
[[d1_databases]]
binding = "DB"
database_name = "arcade"
database_id = "34bb6f35-2d7c-483d-9e7f-9445fb66c9d6"

[observability]
enabled = true
